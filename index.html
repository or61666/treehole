<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>千问心灵树洞</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="心灵树洞">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%23b0bea1'/><circle cx='50' cy='55' r='18' fill='%234a3b2f'/><circle cx='50' cy='52' r='10' fill='%233d2e1c'/></svg>">
<meta name="theme-color" content="#d5dfcb">

<style>
  :root{--moss:#b0bea1;--hollow:#4a3b2f;--warm:#e8985e;--text:#4a4a3a;--glass:rgba(255,255,255,.55)}
  @keyframes firefly-pulse{0%,100%{opacity:.15;transform:translate(0,0) scale(1)}25%{opacity:.9;transform:translate(18px,-22px) scale(1.8)}50%{opacity:.2;transform:translate(-10px,-40px) scale(.8)}75%{opacity:.85;transform:translate(-20px,-10px) scale(1.6)}}
  @keyframes fadeSlideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
  @keyframes ripple{to{transform:scale(3);opacity:0}}
  @keyframes dots{0%,20%{opacity:0}50%{opacity:1}100%{opacity:0}}

  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei",-apple-system,sans-serif;background-color:#d5dfcb;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none}
  body{display:flex;align-items:center;justify-content:center}

  .forest-bg{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 900px 600px at 30% 80%,rgba(149,175,130,.35),transparent 70%),radial-gradient(ellipse 700px 500px at 70% 75%,rgba(139,158,118,.28),transparent 70%),radial-gradient(ellipse 1100px 700px at 50% 100%,rgba(120,140,95,.2),transparent 65%)}
  .distant-trees{position:fixed;bottom:0;left:0;right:0;height:260px;z-index:0;pointer-events:none;opacity:.3}
  .distant-trees::before{content:'';position:absolute;bottom:0;left:-5%;width:110%;height:100%;background:radial-gradient(ellipse 4px 60px at 8% 100%,var(--moss) 50%,transparent 50%),radial-gradient(ellipse 4px 50px at 14% 100%,var(--moss) 50%,transparent 50%),radial-gradient(ellipse 5px 70px at 20% 100%,var(--moss) 50%,transparent 50%),radial-gradient(ellipse 3px 44px at 26% 100%,var(--moss) 50%,transparent 50%),radial-gradient(ellipse 5px 64px at 32% 100%,var(--moss) 50%,transparent 50%),radial-gradient(ellipse 4px 52px at 38% 100%,var(--moss) 50%,transparent 50%),radial-gradient(ellipse 6px 72px at 45% 100%,var(--moss) 50%,transparent 50%),radial-gradient(ellipse 4px 48px at 52% 100%,var(--moss) 50%,transparent 50%),radial-gradient(ellipse 5px 58px at 58% 100%,var(--moss) 50%,transparent 50%),radial-gradient(ellipse 4px 62px at 64% 100%,var(--moss) 50%,transparent 50%),radial-gradient(ellipse 5px 46px at 70% 100%,var(--moss) 50%,transparent 50%),radial-gradient(ellipse 6px 68px at 76% 100%,var(--moss) 50%,transparent 50%),radial-gradient(ellipse 4px 54px at 82% 100%,var(--moss) 50%,transparent 50%),radial-gradient(ellipse 5px 56px at 88% 100%,var(--moss) 50%,transparent 50%),radial-gradient(ellipse 4px 60px at 94% 100%,var(--moss) 50%,transparent 50%);background-size:100% 100%}

  .treehole-illust{position:fixed;bottom:-10px;left:50%;transform:translateX(-50%);width:320px;height:420px;z-index:0;pointer-events:none}
  .glow-ring{position:absolute;bottom:100px;left:50%;transform:translateX(-50%);width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,rgba(250,230,180,.35) 0%,transparent 70%);animation:breathe 4s ease-in-out infinite}
  .trunk{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:150px;height:280px;background:linear-gradient(175deg,#9aad7e,#7d8f62 30%,#5c6b44 70%,#4a5634);border-radius:75px 75px 8px 8px}
  .trunk::after{content:'';position:absolute;left:10%;width:80%;top:0;bottom:20px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.06) 30%,rgba(255,255,255,.1) 50%,rgba(255,255,255,.06) 70%,transparent)}
  .hollow{position:absolute;bottom:50px;left:50%;transform:translateX(-50%);width:52px;height:85px;background:radial-gradient(ellipse at 50% 40%,#6b5540,#3d2e1c 70%,#1e140a);border-radius:26px 26px 20px 20px;box-shadow:inset 0 8px 24px rgba(0,0,0,.6),0 0 0 3px #5c4a32}
  .hollow::after{content:'';position:absolute;top:15px;left:50%;transform:translateX(-50%);width:18px;height:12px;border-radius:50%;background:radial-gradient(circle,rgba(250,225,150,.3) 0%,transparent 70%)}
  .branch{position:absolute;background:linear-gradient(180deg,#8b9e6f,#6b7a50);border-radius:12px}
  .branch-l{width:70px;height:14px;top:30px;left:-45px;transform:rotate(-25deg);border-radius:4px 12px 12px 4px}
  .branch-r{width:65px;height:12px;top:55px;right:-40px;transform:rotate(20deg);border-radius:12px 4px 4px 12px}
  .canopy{position:absolute;border-radius:50%;background:radial-gradient(ellipse at 40% 30%,#b8cda0,#8a9e70 60%,#6e7f55);opacity:.7}
  .canopy-1{width:140px;height:100px;top:-40px;left:-50px}.canopy-2{width:120px;height:90px;top:-55px;left:40px}.canopy-3{width:100px;height:70px;top:-20px;left:80px;opacity:.5}.canopy-4{width:80px;height:55px;top:-10px;left:-70px;opacity:.45}
  .firefly{position:absolute;border-radius:50%}
  .firefly::before{content:'';position:absolute;inset:-3px;border-radius:50%;background:rgba(245,230,150,.4);filter:blur(4px)}
  .ff1{width:4px;height:4px;background:#f5e6a0;bottom:220px;left:60px;animation:firefly-pulse 3.5s ease-in-out infinite}
  .ff2{width:3px;height:3px;background:#f0df98;bottom:180px;right:50px;animation:firefly-pulse 4.2s ease-in-out 1.3s infinite}
  .ff3{width:4px;height:4px;background:#f5e6a0;bottom:260px;left:190px;animation:firefly-pulse 3.8s ease-in-out 2.6s infinite}
  .ff4{width:3px;height:3px;background:#eee0a0;bottom:160px;right:120px;animation:firefly-pulse 4.5s ease-in-out .7s infinite}
  .ff5{width:4px;height:4px;background:#f2e4a0;bottom:240px;left:130px;animation:firefly-pulse 3.2s ease-in-out 3.2s infinite}

  .container{position:relative;z-index:1;width:92%;max-width:500px;height:100%;display:flex;flex-direction:column;gap:12px;padding:env(safe-area-inset-top,20px) 0 env(safe-area-inset-bottom,40px) 0}
  .header{text-align:center;padding-top:10px}
  .header h1{font-size:28px;font-weight:300;color:#3e4d2e;letter-spacing:6px;text-shadow:0 2px 8px rgba(100,120,80,.1)}
  .header .tagline{margin-top:4px;font-size:12px;color:#6e7f5b;letter-spacing:3px;font-weight:300}

  .chat{flex:1;background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:22px;padding:18px 16px;overflow-y:auto;-webkit-overflow-scrolling:touch;box-shadow:0 6px 30px rgba(70,90,50,.06),0 1px 3px rgba(0,0,0,.04);display:flex;flex-direction:column;gap:10px;border:1px solid rgba(255,255,255,.4);margin-bottom:4px}
  .chat::-webkit-scrollbar{width:4px}.chat::-webkit-scrollbar-thumb{background:#c4cfb5;border-radius:2px}
  .chat-empty{align-self:center;color:#a4b899;font-size:13px;letter-spacing:1px;padding:40px 0;text-align:center;line-height:2}
  .chat-empty::before{content:'\2014\2014';display:block;font-size:11px;letter-spacing:6px;color:#c0cdb0;margin-bottom:8px}

  .msg{padding:12px 16px;border-radius:16px;font-size:14px;line-height:1.75;max-width:86%;animation:fadeSlideUp .4s ease-out;word-break:break-word}
  .msg-user{align-self:flex-end;background:#e5ebdb;color:#3a4a2f;border-bottom-right-radius:6px}
  .msg-ai{align-self:flex-start;background:#f8f4ed;color:#4a4a3a;border-bottom-left-radius:6px;box-shadow:0 2px 10px rgba(130,110,80,.06)}
  .msg-typing{align-self:flex-start;background:#f8f4ed;color:#9a9780;border-bottom-left-radius:6px;box-shadow:0 2px 10px rgba(130,110,80,.04);display:flex;align-items:center;gap:8px}
  .msg-typing .dot{width:5px;height:5px;border-radius:50%;background:#c4cfb5;animation:dots 1.4s ease-in-out infinite}
  .msg-typing .dot:nth-child(2){animation-delay:.2s}.msg-typing .dot:nth-child(3){animation-delay:.4s}

  .input-bar{display:flex;align-items:center;gap:10px;flex-shrink:0;background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:28px;padding:5px 5px 5px 20px;box-shadow:0 6px 28px rgba(70,90,50,.08),0 1px 3px rgba(0,0,0,.04);border:1px solid rgba(255,255,255,.45)}
  .input-bar textarea{flex:1;border:none;background:transparent;font-size:15px;color:#3a4a2f;resize:none;outline:none;font-family:inherit;line-height:1.5;padding:6px 0;max-height:100px;min-height:26px}
  .input-bar textarea::placeholder{color:#b5c4a3;font-size:14px;letter-spacing:.3px}
  .btn-send{width:48px;height:48px;min-width:48px;border:none;border-radius:50%;background:linear-gradient(140deg,#f0b070,#e08840);color:#fff;cursor:pointer;position:relative;overflow:hidden;box-shadow:0 4px 16px rgba(210,130,60,.35);transition:transform .2s;display:flex;align-items:center;justify-content:center}
  .btn-send:active{transform:scale(.94)}.btn-send:disabled{opacity:.4;cursor:not-allowed;transform:none}
  .btn-send svg{width:19px;height:19px}
  .btn-send .ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.5);animation:ripple .6s ease-out forwards;pointer-events:none}

  @media(max-width:480px){.header h1{font-size:24px}.treehole-illust{width:260px;height:340px}.trunk{width:120px;height:220px}.hollow{width:42px;height:68px;bottom:40px}.canopy-1{width:110px;height:80px;top:-30px;left:-40px}.canopy-2{width:95px;height:72px;top:-44px;left:30px}}
.logo-badge{position:absolute;top:12px;right:12px;z-index:10;width:80px;opacity:.85}
</style>
</head>

<div class="forest-bg"></div>
<div class="distant-trees"></div>

<div class="treehole-illust">
  <div class="glow-ring"></div>
  <div class="trunk">
    <div class="branch branch-l"></div>
    <div class="branch branch-r"></div>
    <div class="hollow"></div>
  </div>
  <div class="canopy canopy-1"></div><div class="canopy canopy-2"></div>
  <div class="canopy canopy-3"></div><div class="canopy canopy-4"></div>
  <div class="firefly ff1"></div><div class="firefly ff2"></div>
  <div class="firefly ff3"></div><div class="firefly ff4"></div><div class="firefly ff5"></div>
</div>

<div class="header">
    <h1>千问心灵树洞</h1>
    <p class="tagline">说你想说 &middot; 这里永远倾听</p>
  </div>

  <div class="chat" id="chatBox">
    <div class="chat-empty" id="emptyHint">树洞在聆听</div>
  </div>

  <div class="input-bar">
    <textarea id="msgInput" rows="1" placeholder="今天有什么想对树洞说的吗？" maxlength="2000" enterkeyhint="send"></textarea>
    <button class="btn-send" id="sendBtn" aria-label="发送">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </button>
  </div>
</div>

<script>
(function(){
  const chatBox=document.getElementById('chatBox'),msgInput=document.getElementById('msgInput'),
        sendBtn=document.getElementById('sendBtn'),emptyHint=document.getElementById('emptyHint');

  const API_URL='https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions';
  const API_KEY='sk-b1e6bd5b4ae247a79df83d60ad4c7a56';

  function addMsg(t,c){
    if(emptyHint)emptyHint.remove();
    const e=document.createElement('div');e.className='msg '+c;e.textContent=t;
    chatBox.appendChild(e);chatBox.scrollTop=chatBox.scrollHeight;return e;
  }

  function typing(){
    const e=document.createElement('div');e.className='msg msg-typing';
    e.innerHTML='树洞正在倾听<span class="dot"></span><span class="dot"></span><span class="dot"></span>';
    chatBox.appendChild(e);chatBox.scrollTop=chatBox.scrollHeight;return e;
  }

  async function send(){
    const t=msgInput.value.trim();if(!t)return;
    addMsg(t,'msg-user');msgInput.value='';msgInput.style.height='auto';sendBtn.disabled=true;

    const r=document.createElement('span');r.className='ripple';r.style.width=r.style.height='20px';
    r.style.left='14px';r.style.top='14px';sendBtn.appendChild(r);setTimeout(()=>r.remove(),600);

    const ty=typing();
    try{
      const resp=await fetch(API_URL,{
        method:'POST',
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+API_KEY},
        body:JSON.stringify({
          model:'qwen-plus',
          messages:[
            {role:'system',content:'你是「千问心灵树洞」，温暖、治愈的倾听者。你住在一棵古老的大树里。回复温柔但不油腻，简短有力量（2-4句话），像朋友一样自然。偶尔用森林、树木、阳光、微风等意象。不说教，先共情再轻轻引导。'},
            {role:'user',content:t}
          ],
          temperature:.85,max_tokens:300
        })
      });
      const d=await resp.json();
      ty.remove();
      if(d.choices&&d.choices[0])addMsg(d.choices[0].message.content.trim(),'msg-ai');
      else addMsg('树洞的思绪有些飘远，请再试一次。','msg-ai');
    }catch(e){
      ty.remove();addMsg('树洞的思绪有些飘远，请再试一次。','msg-ai');
    }
    sendBtn.disabled=false;msgInput.focus();
  }

  sendBtn.addEventListener('click',send);
  msgInput.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});
  msgInput.addEventListener('input',()=>{msgInput.style.height='auto';msgInput.style.height=Math.min(msgInput.scrollHeight,100)+'px';});
})();
</script>
